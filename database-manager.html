<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Manager - Susan Shop</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 2rem; background: #f8f9fa; }
        .container { max-width: 1000px; margin: 0 auto; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 2rem; border-radius: 15px; text-align: center; margin-bottom: 2rem; }
        .section { background: white; margin: 2rem 0; padding: 2rem; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .section h2 { color: #333; margin-bottom: 1rem; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin: 1rem 0; }
        .stat-card { background: #f8f9fa; padding: 1rem; border-radius: 10px; text-align: center; border-left: 4px solid #667eea; }
        .stat-number { font-size: 2rem; font-weight: bold; color: #667eea; }
        .stat-label { color: #666; font-size: 0.9rem; }
        button { background: #667eea; color: white; border: none; padding: 0.8rem 1.5rem; border-radius: 8px; cursor: pointer; margin: 0.5rem; font-size: 1rem; transition: all 0.3s; }
        button:hover { background: #5a6fd8; transform: translateY(-2px); }
        button.danger { background: #dc3545; }
        button.danger:hover { background: #c82333; }
        button.success { background: #28a745; }
        button.success:hover { background: #218838; }
        button.warning { background: #ffc107; color: #212529; }
        button.warning:hover { background: #e0a800; }
        .status { padding: 1rem; border-radius: 8px; margin: 1rem 0; }
        .status.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .status.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .status.info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        .status.warning { background: #fff3cd; color: #856404; border: 1px solid #ffeaa7; }
        .users-table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
        .users-table th, .users-table td { padding: 0.8rem; text-align: left; border-bottom: 1px solid #e9ecef; }
        .users-table th { background: #f8f9fa; font-weight: bold; }
        .users-table tr:hover { background: #f8f9fa; }
        .role-badge { padding: 0.2rem 0.6rem; border-radius: 12px; font-size: 0.8rem; font-weight: 500; }
        .role-badge.admin { background: #fff3cd; color: #856404; }
        .role-badge.user { background: #d1ecf1; color: #0c5460; }
        pre { background: #f8f9fa; padding: 1rem; border-radius: 5px; overflow-x: auto; font-size: 0.9rem; max-height: 300px; overflow-y: auto; }
        .file-input { margin: 1rem 0; }
        .file-input input { padding: 0.5rem; border: 1px solid #ddd; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-database"></i> Database Manager</h1>
            <p>Quản lý và debug database Susan Shop</p>
        </div>

        <div class="section">
            <h2>📊 Database Statistics</h2>
            <div class="stats-grid" id="statsGrid">
                <!-- Stats will be loaded here -->
            </div>
            <button onclick="refreshStats()">Refresh Stats</button>
        </div>

        <div class="section">
            <h2>👥 Users Management</h2>
            <div class="users-container">
                <table class="users-table" id="usersTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Created</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                        <!-- Users will be loaded here -->
                    </tbody>
                </table>
            </div>
            <button onclick="refreshUsers()">Refresh Users</button>
            <button onclick="addTestUser()" class="success">Add Test User</button>
        </div>

        <div class="section">
            <h2>💾 Database Operations</h2>
            <div class="operations">
                <button onclick="backupDatabase()" class="success">
                    <i class="fas fa-save"></i> Backup Database
                </button>
                <button onclick="restoreDatabase()" class="warning">
                    <i class="fas fa-undo"></i> Restore from Backup
                </button>
                <button onclick="exportDatabase()">
                    <i class="fas fa-download"></i> Export Database
                </button>
                <div class="file-input">
                    <input type="file" id="importFile" accept=".json" onchange="importDatabase(event)">
                    <label for="importFile">Import Database JSON</label>
                </div>
                <button onclick="clearAllData()" class="danger">
                    <i class="fas fa-trash"></i> Clear All Data
                </button>
            </div>
            <div id="operationStatus" class="status info">Ready for operations</div>
        </div>

        <div class="section">
            <h2>🔍 LocalStorage Debug</h2>
            <div id="localStorageDebug">
                <!-- Debug info will be loaded here -->
            </div>
            <button onclick="showLocalStorageInfo()">Show LocalStorage Info</button>
            <button onclick="clearLocalStorage()" class="danger">Clear LocalStorage</button>
        </div>

        <div class="section">
            <h2>📝 Raw Database Data</h2>
            <pre id="rawData">Loading...</pre>
            <button onclick="showRawData()">Show Raw Data</button>
            <button onclick="validateDatabase()">Validate Database</button>
        </div>

        <div class="section">
            <h2>🚀 Quick Actions</h2>
            <button onclick="window.location.href='index.html'">Go to Home</button>
            <button onclick="window.location.href='login.html'">Go to Login</button>
            <button onclick="window.location.href='register.html'">Go to Register</button>
            <button onclick="window.location.href='admin.html'">Go to Admin</button>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/database-utils.js"></script>
    <script>
        // Initialize page
        document.addEventListener('DOMContentLoaded', async function() {
            // Wait for database to load
            while (!database) {
                await new Promise(resolve => setTimeout(resolve, 100));
            }
            
            refreshStats();
            refreshUsers();
            showLocalStorageInfo();
            showRawData();
        });

        function refreshStats() {
            const stats = getDatabaseStats();
            const statsGrid = document.getElementById('statsGrid');
            
            if (!stats) {
                statsGrid.innerHTML = '<p>Database not loaded</p>';
                return;
            }
            
            statsGrid.innerHTML = `
                <div class="stat-card">
                    <div class="stat-number">${stats.users}</div>
                    <div class="stat-label">Users</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${stats.products}</div>
                    <div class="stat-label">Products</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${stats.categories}</div>
                    <div class="stat-label">Categories</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${stats.orders}</div>
                    <div class="stat-label">Orders</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${Math.round(stats.localStorageSize / 1024)}</div>
                    <div class="stat-label">KB in Storage</div>
                </div>
            `;
        }

        function refreshUsers() {
            const tbody = document.getElementById('usersTableBody');
            
            if (!database || !database.users) {
                tbody.innerHTML = '<tr><td colspan="6">No users found</td></tr>';
                return;
            }
            
            tbody.innerHTML = database.users.map(user => `
                <tr>
                    <td>${user.id}</td>
                    <td>${user.name}</td>
                    <td>${user.email}</td>
                    <td><span class="role-badge ${user.role}">${user.role}</span></td>
                    <td>${user.created_at ? new Date(user.created_at).toLocaleDateString('vi-VN') : 'N/A'}</td>
                    <td>
                        <button onclick="deleteUser(${user.id})" class="danger" style="padding: 0.3rem 0.8rem; font-size: 0.8rem;">
                            Delete
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function addTestUser() {
            if (!database) {
                alert('Database not loaded');
                return;
            }
            
            const randomNum = Math.floor(Math.random() * 1000);
            const newUser = {
                id: Math.max(...database.users.map(u => u.id), 0) + 1,
                name: `Test User ${randomNum}`,
                email: `testuser${randomNum}@example.com`,
                phone: `012345${randomNum.toString().padStart(4, '0')}`,
                address: `${randomNum} Test Street`,
                password: `test${randomNum}`,
                role: 'user',
                created_at: new Date().toISOString()
            };
            
            database.users.push(newUser);
            localStorage.setItem('database', JSON.stringify(database));
            localStorage.setItem('users_backup', JSON.stringify(database.users));
            
            refreshStats();
            refreshUsers();
            
            alert(`Test user created: ${newUser.email} / ${newUser.password}`);
        }

        function deleteUser(userId) {
            if (!confirm('Delete this user?')) return;
            
            database.users = database.users.filter(u => u.id !== userId);
            localStorage.setItem('database', JSON.stringify(database));
            localStorage.setItem('users_backup', JSON.stringify(database.users));
            
            refreshStats();
            refreshUsers();
        }

        function showLocalStorageInfo() {
            const debug = document.getElementById('localStorageDebug');
            const dbData = localStorage.getItem('database');
            const usersBackup = localStorage.getItem('users_backup');
            const currentUser = localStorage.getItem('currentUser');
            
            let html = '<h3>LocalStorage Contents:</h3>';
            
            if (dbData) {
                try {
                    const db = JSON.parse(dbData);
                    html += `<p><strong>Database:</strong> ${db.users?.length || 0} users, ${Math.round(dbData.length/1024)}KB</p>`;
                } catch (e) {
                    html += `<p><strong>Database:</strong> Invalid JSON (${Math.round(dbData.length/1024)}KB)</p>`;
                }
            } else {
                html += `<p><strong>Database:</strong> Not found</p>`;
            }
            
            if (usersBackup) {
                try {
                    const users = JSON.parse(usersBackup);
                    html += `<p><strong>Users Backup:</strong> ${users.length} users</p>`;
                } catch (e) {
                    html += `<p><strong>Users Backup:</strong> Invalid JSON</p>`;
                }
            } else {
                html += `<p><strong>Users Backup:</strong> Not found</p>`;
            }
            
            if (currentUser) {
                try {
                    const user = JSON.parse(currentUser);
                    html += `<p><strong>Current User:</strong> ${user.name} (${user.email})</p>`;
                } catch (e) {
                    html += `<p><strong>Current User:</strong> Invalid JSON</p>`;
                }
            } else {
                html += `<p><strong>Current User:</strong> Not logged in</p>`;
            }
            
            debug.innerHTML = html;
        }

        function clearLocalStorage() {
            if (confirm('Clear all localStorage data?')) {
                localStorage.clear();
                showLocalStorageInfo();
                refreshStats();
                refreshUsers();
                alert('LocalStorage cleared. Refresh page to reload from JSON.');
            }
        }

        function showRawData() {
            const rawData = document.getElementById('rawData');
            if (database) {
                rawData.textContent = JSON.stringify(database, null, 2);
            } else {
                rawData.textContent = 'Database not loaded';
            }
        }

        function validateDatabase() {
            const status = document.getElementById('operationStatus');
            
            if (!database) {
                status.innerHTML = '❌ Database not loaded';
                status.className = 'status error';
                return;
            }
            
            let errors = [];
            
            if (!database.users || !Array.isArray(database.users)) {
                errors.push('Users array missing or invalid');
            }
            
            if (!database.products || !Array.isArray(database.products)) {
                errors.push('Products array missing or invalid');
            }
            
            if (!database.categories || !Array.isArray(database.categories)) {
                errors.push('Categories array missing or invalid');
            }
            
            if (errors.length === 0) {
                status.innerHTML = '✅ Database structure is valid';
                status.className = 'status success';
            } else {
                status.innerHTML = `❌ Database errors:<br>${errors.join('<br>')}`;
                status.className = 'status error';
            }
        }

        // Auto-refresh every 5 seconds
        setInterval(() => {
            refreshStats();
            showLocalStorageInfo();
        }, 5000);
    </script>
</body>
</html>
