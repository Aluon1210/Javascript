<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Login - Susan Shop</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 2rem;
            background: #f8f9fa;
        }
        .test-container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .test-section {
            margin: 2rem 0;
            padding: 1rem;
            border: 1px solid #e9ecef;
            border-radius: 8px;
        }
        .form-group {
            margin: 1rem 0;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }
        .form-group input {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
        }
        button {
            background: #007BFF;
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 5px;
            cursor: pointer;
            margin: 0.5rem;
            font-size: 1rem;
        }
        button:hover {
            background: #0069d9;
        }
        .status {
            padding: 1rem;
            border-radius: 5px;
            margin: 1rem 0;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        pre {
            background: #f8f9fa;
            padding: 1rem;
            border-radius: 5px;
            overflow-x: auto;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🔐 Test Login & Register</h1>
        
        <div class="test-section">
            <h2>1. Database Status</h2>
            <div id="dbStatus" class="status info">Đang kiểm tra...</div>
            <button onclick="checkDatabase()">Check Database</button>
        </div>

        <div class="test-section">
            <h2>2. Test Login</h2>
            <form id="testLoginForm">
                <div class="form-group">
                    <label for="testEmail">Email:</label>
                    <input type="email" id="testEmail" value="admin@susanshop.com">
                </div>
                <div class="form-group">
                    <label for="testPassword">Password:</label>
                    <input type="password" id="testPassword" value="admin123">
                </div>
                <button type="submit">Test Login</button>
                <button type="button" onclick="fillUserAccount()">Fill User Account</button>
            </form>
            <div id="loginStatus" class="status info">Chưa test</div>
        </div>

        <div class="test-section">
            <h2>3. Test Register</h2>
            <form id="testRegisterForm">
                <div class="form-group">
                    <label for="regFirstName">Họ:</label>
                    <input type="text" id="regFirstName" value="Nguyễn">
                </div>
                <div class="form-group">
                    <label for="regLastName">Tên:</label>
                    <input type="text" id="regLastName" value="Văn A">
                </div>
                <div class="form-group">
                    <label for="regEmail">Email:</label>
                    <input type="email" id="regEmail" value="newuser@test.com">
                </div>
                <div class="form-group">
                    <label for="regPhone">Phone:</label>
                    <input type="tel" id="regPhone" value="0123456789">
                </div>
                <div class="form-group">
                    <label for="regAddress">Address:</label>
                    <input type="text" id="regAddress" value="123 Test Street">
                </div>
                <div class="form-group">
                    <label for="regPassword">Password:</label>
                    <input type="password" id="regPassword" value="newuser123">
                </div>
                <button type="submit">Test Register</button>
            </form>
            <div id="registerStatus" class="status info">Chưa test</div>
        </div>

        <div class="test-section">
            <h2>4. Current State</h2>
            <div id="currentState">
                <p><strong>Current User:</strong> <span id="currentUserDisplay">None</span></p>
                <p><strong>Database Users:</strong> <span id="databaseUsers">Loading...</span></p>
            </div>
            <button onclick="refreshState()">Refresh State</button>
            <button onclick="clearAll()">Clear All Data</button>
        </div>

        <div class="test-section">
            <h2>5. Navigation Test</h2>
            <button onclick="goToLogin()">Go to Login Page</button>
            <button onclick="goToRegister()">Go to Register Page</button>
            <button onclick="goToProfile()">Go to Profile Page</button>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        let testDatabase = null;

        async function checkDatabase() {
            const status = document.getElementById('dbStatus');
            status.innerHTML = 'Đang tải database...';
            status.className = 'status info';

            try {
                const response = await fetch('data/database.json');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                testDatabase = await response.json();
                
                status.innerHTML = `✅ Database loaded successfully!<br>
                    Users: ${testDatabase.users?.length || 0}<br>
                    Products: ${testDatabase.products?.length || 0}`;
                status.className = 'status success';
                
                refreshState();
                
            } catch (error) {
                status.innerHTML = `❌ Database load failed: ${error.message}`;
                status.className = 'status error';
            }
        }

        async function testLogin() {
            const email = document.getElementById('testEmail').value;
            const password = document.getElementById('testPassword').value;
            const status = document.getElementById('loginStatus');
            
            status.innerHTML = 'Đang test đăng nhập...';
            status.className = 'status info';

            if (!testDatabase) {
                status.innerHTML = '❌ Database chưa load. Hãy check database trước.';
                status.className = 'status error';
                return;
            }

            const user = testDatabase.users.find(u => u.email === email && u.password === password);
            
            if (user) {
                currentUser = user;
                localStorage.setItem('currentUser', JSON.stringify(user));
                
                status.innerHTML = `✅ Đăng nhập thành công!<br>
                    Name: ${user.name}<br>
                    Role: ${user.role}<br>
                    Email: ${user.email}`;
                status.className = 'status success';
                
                refreshState();
            } else {
                status.innerHTML = '❌ Đăng nhập thất bại! Email hoặc mật khẩu không đúng.';
                status.className = 'status error';
            }
        }

        async function testRegister() {
            const firstName = document.getElementById('regFirstName').value;
            const lastName = document.getElementById('regLastName').value;
            const email = document.getElementById('regEmail').value;
            const phone = document.getElementById('regPhone').value;
            const address = document.getElementById('regAddress').value;
            const password = document.getElementById('regPassword').value;
            const status = document.getElementById('registerStatus');
            
            status.innerHTML = 'Đang test đăng ký...';
            status.className = 'status info';

            if (!testDatabase) {
                status.innerHTML = '❌ Database chưa load. Hãy check database trước.';
                status.className = 'status error';
                return;
            }

            // Check if email exists
            const existingUser = testDatabase.users.find(u => u.email === email);
            if (existingUser) {
                status.innerHTML = '❌ Email đã được sử dụng!';
                status.className = 'status error';
                return;
            }

            // Create new user
            const newUser = {
                id: Math.max(...testDatabase.users.map(u => u.id), 0) + 1,
                name: `${firstName} ${lastName}`,
                email: email,
                phone: phone,
                address: address,
                password: password,
                role: 'user',
                created_at: new Date().toISOString()
            };

            testDatabase.users.push(newUser);
            
            status.innerHTML = `✅ Đăng ký thành công!<br>
                Name: ${newUser.name}<br>
                Email: ${newUser.email}<br>
                ID: ${newUser.id}`;
            status.className = 'status success';
            
            refreshState();
        }

        function fillUserAccount() {
            document.getElementById('testEmail').value = 'user@test.com';
            document.getElementById('testPassword').value = 'user123';
        }

        function refreshState() {
            const currentUserDisplay = document.getElementById('currentUserDisplay');
            const databaseUsers = document.getElementById('databaseUsers');
            
            if (currentUser) {
                currentUserDisplay.innerHTML = `${currentUser.name} (${currentUser.role})`;
            } else {
                currentUserDisplay.innerHTML = 'None';
            }
            
            if (testDatabase && testDatabase.users) {
                databaseUsers.innerHTML = `${testDatabase.users.length} users loaded`;
            } else {
                databaseUsers.innerHTML = 'Not loaded';
            }
        }

        function clearAll() {
            if (confirm('Clear all data including localStorage?')) {
                localStorage.clear();
                currentUser = null;
                testDatabase = null;
                refreshState();
                
                document.getElementById('loginStatus').innerHTML = 'Cleared';
                document.getElementById('loginStatus').className = 'status info';
                document.getElementById('registerStatus').innerHTML = 'Cleared';
                document.getElementById('registerStatus').className = 'status info';
            }
        }

        function goToLogin() {
            window.location.href = 'login.html';
        }

        function goToRegister() {
            window.location.href = 'register.html';
        }

        function goToProfile() {
            window.location.href = 'profile.html';
        }

        // Setup form handlers
        document.getElementById('testLoginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            testLogin();
        });

        document.getElementById('testRegisterForm').addEventListener('submit', function(e) {
            e.preventDefault();
            testRegister();
        });

        // Auto check database on load
        setTimeout(checkDatabase, 1000);
        setInterval(refreshState, 3000);
    </script>
</body>
</html>
